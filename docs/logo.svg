<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Voiceym</title>
  <desc id="description">Five sound bars hanging from one line, their lengths tracing the letter V, on a deep indigo rounded tile.</desc>
  <defs>
    <linearGradient id="tile" x1="8" y1="2" x2="56" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D1A44"/>
      <stop offset="1" stop-color="#0C0B1F"/>
    </linearGradient>
    <linearGradient id="voice" x1="11" y1="15" x2="53" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#E879F9"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g fill="url(#voice)">
    <rect x="11" y="15" width="6" height="12" rx="3"/>
    <rect x="20" y="15" width="6" height="22" rx="3"/>
    <rect x="29" y="15" width="6" height="34" rx="3"/>
    <rect x="38" y="15" width="6" height="22" rx="3"/>
    <rect x="47" y="15" width="6" height="12" rx="3"/>
  </g>
</svg>
