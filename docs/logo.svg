<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Voiceym</title>
  <desc id="description">Seven rounded sound bars that rise and fall like a voice and together form the letter V, on a deep indigo rounded tile.</desc>
  <defs>
    <linearGradient id="tile" x1="10" y1="2" x2="54" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#262257"/><stop offset="1" stop-color="#0B0A1E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(32 34) scale(26 22)">
      <stop stop-color="#7C83F7" stop-opacity="0.38"/><stop offset="1" stop-color="#7C83F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="32" y1="2" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="voice" x1="10" y1="12" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#E879F9"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tile)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#glow)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="url(#sheen)" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <g fill="url(#voice)">
    <rect x="8.5" y="12" width="5" height="12" rx="2.5"/>
    <rect x="15.5" y="18" width="5" height="17" rx="2.5"/>
    <rect x="22.5" y="28.5" width="5" height="13" rx="2.5"/>
    <rect x="29.5" y="36" width="5" height="16" rx="2.5"/>
    <rect x="36.5" y="28.5" width="5" height="13" rx="2.5"/>
    <rect x="43.5" y="18" width="5" height="17" rx="2.5"/>
    <rect x="50.5" y="12" width="5" height="12" rx="2.5"/>
  </g>
</svg>
